[package]
name = "qsd"
version = "0.1.0"
edition = "2024"
description = "Headless Quick Share daemon for the Decky plugin: rqs_lib driven over JSON lines on stdin/stdout"
license = "GPL-3.0"

[dependencies]
# Patched fork of https://github.com/ignotusbucius/open-quickshare (GPL-3.0). Not vendored in this repo: run
# `daemon/setup-vendor.sh` once to clone the pinned upstream commit and apply daemon/patches/*.patch, or point this
# at your own checkout of open-quickshare with the same patches applied.
rqs_lib = { path = "vendor/open-quickshare/core_lib" }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync", "time", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
